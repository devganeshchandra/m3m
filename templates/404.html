{% extends "base.html" %}

{% block title %}Page not found | {{ site.site_name }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}

{% block content %}
<main id="main-content" class="text-page">
  <div class="text-page__inner">
    <p class="section-label"><span class="section-label__rule"></span>404</p>
    <h1>{{ st.not_found_title }}</h1>
    <div class="text-page__body"><p>{{ st.not_found_text }}</p></div>
    <a class="text-link" href="/#projects">
      <span>{{ st.not_found_button }}</span>
      {% include "icons/arrow.html" %}
    </a>
  </div>
</main>
{% endblock %}
