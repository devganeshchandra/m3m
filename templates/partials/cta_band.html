<section class="cta-band" aria-labelledby="cta-band-title">
  <div class="cta-band__inner">
    <div>
      <p class="ip-label ip-label--light"><span aria-hidden="true"></span>Private consultation</p>
      <h2 id="cta-band-title">Let’s find <em>your next address.</em></h2>
      <p>Speak with our team about any M3M project, from configurations and pricing to a personal site visit.</p>
    </div>
    <div class="cta-band__actions">
      <button aria-haspopup="dialog" class="ip-button ip-button--gold" data-enquiry-open type="button">
        <span>Request a call back</span>
        {% include "icons/arrow.html" %}
      </button>
      <a class="ip-button ip-button--ghost" href="{{ site.whatsapp_url }}" rel="noreferrer" target="_blank">
        {% include "icons/whatsapp.html" %}
        <span>WhatsApp our team</span>
      </a>
      <a class="cta-band__phone" href="tel:{{ site.phone_dial }}">or call toll-free <strong>{{ site.phone_display }}</strong></a>
    </div>
  </div>
</section>
