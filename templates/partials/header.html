{% load static %}
<header class="site-header" data-site-header>
  <div class="site-header__inner">
    <a class="wordmark" href="/" aria-label="M3M India home" data-home-link>
      <img
        alt=""
        class="wordmark__logo wordmark__logo--color"
        height="56"
        width="180"
        src="{% static 'images/logo/m3m-logo.png' %}"
        data-logo-color="{% static 'images/logo/m3m-logo.png' %}"
        data-logo-transparent="{% static 'images/logo/logo_tranparent.webp' %}"
        fetchpriority="high"
      >
      <span class="visually-hidden">M3M India</span>
    </a>

    <nav class="desktop-nav" aria-label="Main navigation">
      {% for item in navigation %}
        {% if item.featured %}
          <a class="desktop-nav__link desktop-nav__link--featured{% if item.active %} is-active{% endif %}" href="{{ item.href }}"{% if item.active %} aria-current="page"{% endif %}>
            <span class="desktop-nav__gem" aria-hidden="true"></span>
            <span class="desktop-nav__shine">{{ item.label }}</span>
          </a>
        {% else %}
          <a class="desktop-nav__link{% if item.active %} is-active{% endif %}" href="{{ item.href }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.label }}</a>
        {% endif %}
      {% endfor %}
    </nav>

    <div class="site-header__actions">
      <a class="header-phone" href="tel:{{ site.phone_dial }}">{{ site.phone_display }}</a>
      <a aria-label="Chat with M3M India on WhatsApp" class="header-whatsapp" href="{{ site.whatsapp_url }}" rel="noreferrer" target="_blank">
        {% include "icons/whatsapp.html" %}
      </a>
      <button aria-haspopup="dialog" class="header-consultation" data-enquiry-open type="button">
        <span>Private consultation</span>
        {% include "icons/arrow.html" %}
      </button>
    </div>
  </div>
</header>
