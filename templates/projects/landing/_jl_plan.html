{% comment %}
  Illustrative floor plan drawn behind the blur on a locked plan card, used until the admin uploads the
  real plan. Expects: rooms (1, 2 or 3; each step adds a bedroom), so the three cards differ.
{% endcomment %}
<svg class="jl-plan__svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <rect class="jl-plan__floor" x="0" y="0" width="400" height="300"/>
  <g class="jl-plan__rooms">
    <rect x="22" y="22" width="150" height="120"/>
    <rect x="172" y="22" width="110" height="120"/>
    <rect x="282" y="22" width="96" height="78"/>
    <rect x="22" y="142" width="96" height="136"/>
    <rect x="118" y="142" width="164" height="136"/>
    <rect x="282" y="100" width="96" height="{% if rooms > 1 %}88{% else %}178{% endif %}"/>
    {% if rooms > 1 %}<rect x="282" y="188" width="96" height="90"/>{% endif %}
    {% if rooms > 2 %}<rect x="118" y="210" width="80" height="68"/>{% endif %}
  </g>
  <g class="jl-plan__walls">
    <rect x="22" y="22" width="356" height="256"/>
    <path d="M172 22v120M282 22v256M22 142h356M118 142v136M282 100h96"/>
    {% if rooms > 1 %}<path d="M282 188h96"/>{% endif %}
    {% if rooms > 2 %}<path d="M118 210h80v68"/>{% endif %}
  </g>
  <g class="jl-plan__doors">
    <path d="M150 142a22 22 0 0 1 22-22M260 142a22 22 0 0 0 22 22M96 142a22 22 0 0 0 22 22M282 78a22 22 0 0 1-22 22M356 100a22 22 0 0 0-22 22"/>
    {% if rooms > 1 %}<path d="M282 210a22 22 0 0 0 22-22"/>{% endif %}
  </g>
  <g class="jl-plan__furniture">
    <rect x="44" y="44" width="66" height="44" rx="6"/>
    <rect x="196" y="50" width="62" height="56" rx="4"/>
    <circle cx="200" cy="210" r="28"/>
    <rect x="40" y="170" width="58" height="80" rx="4"/>
    <rect x="300" y="36" width="60" height="44" rx="4"/>
    <rect x="300" y="118" width="60" height="{% if rooms > 1 %}50{% else %}110{% endif %}" rx="4"/>
    {% if rooms > 1 %}<rect x="300" y="206" width="60" height="54" rx="4"/>{% endif %}
  </g>
  <path class="jl-plan__balcony" d="M22 278c60 16 296 16 356 0"/>
</svg>
